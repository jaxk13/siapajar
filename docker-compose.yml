# Local development only. Not used in production (production runs PostgreSQL on the VPS).
#
# Usage:
#   cp .env.example .env        # then set POSTGRES_PASSWORD
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down        # stop (data is kept)
#   docker compose -f docker-compose.dev.yml down -v     # stop and DELETE local data

name: siapajar-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: siapajar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siapajar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-siapajar_dev}
    ports:
      # Bound to localhost only; the database must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
